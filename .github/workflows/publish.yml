name: Publish Component IQ

on:
  push:
    branches:
      - main
    paths:
      - 'packages/design-system/**'
      - 'packages/ai/**'
      - 'packages/shared-types/**'
      - 'README.npm.md'
      - 'package-lock.json'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish without publishing
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type check library
        run: npm run type-check --workspace=packages/design-system

      - name: Build library and dependencies
        run: npx turbo run build --filter=componentiq...

      - name: Use npm package README
        run: cp ../../README.npm.md README.md
        working-directory: packages/design-system

      - name: Bump patch version
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --workspace=packages/design-system --no-git-tag-version
          VERSION=$(node -p "require('./packages/design-system/package.json').version")
          git add packages/design-system/package.json
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm publish --dry-run --access public
        working-directory: packages/design-system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: npm publish --access public --provenance
        working-directory: packages/design-system
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
