name: Storybook Vercel Deploy

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: storybook-vercel-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    env:
      VERCEL_ORG_ID: ${{ secrets.STORYBOOK_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.STORYBOOK_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing GitHub secret: VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub secret: STORYBOOK_VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub secret: STORYBOOK_VERCEL_PROJECT_ID"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build library packages
        run: npx turbo run build --filter=@winniekagendo/docs^...

      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: npx vercel@latest build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        run: npx vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN"

  production:
    name: Production Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      VERCEL_ORG_ID: ${{ secrets.STORYBOOK_VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.STORYBOOK_VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Vercel secrets
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing GitHub secret: VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing GitHub secret: STORYBOOK_VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing GitHub secret: STORYBOOK_VERCEL_PROJECT_ID"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build library packages
        run: npx turbo run build --filter=@winniekagendo/docs^...

      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel output
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
