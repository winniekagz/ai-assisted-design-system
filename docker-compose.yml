services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '4000'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      DATABASE_URL: postgresql://componentiq:componentiq@postgres:5432/componentiq?schema=public
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-ComponentIQ <onboarding@example.com>}
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: apps/api/src
        - action: rebuild
          path: apps/api/prisma
        - action: rebuild
          path: packages/shared-types
        - action: rebuild
          path: apps/api/package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: package.json

  postgres:
    image: postgres:16
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: componentiq
      POSTGRES_PASSWORD: componentiq
      POSTGRES_DB: componentiq
    volumes:
      - componentiq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U componentiq -d componentiq']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  componentiq_postgres_data:
